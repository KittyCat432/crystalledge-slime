- type: entity
  id: CEConsumableManaMoteBase
  parent: BaseItem
  name: mana mote
  description: TODO
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Potions/small_bottle.rsi #TODO replace later
    layers:
    - state: icon
  - type: Item
    size: Tiny
  - type: CEConsumable
    whitelist:
      components:
      - CEMobState
    useDelay: 0.25
    useSound:
      path: /Audio/Items/drink.ogg #TODO replace later
  - type: TimedDespawn
    lifetime: 30

- type: entity
  id: CEConsumableManaMoteTiny
  parent: CEConsumableManaMoteBase
  name: tiny mana mote
  components:
#  - type: Sprite
#    layers:
#    - state: tiny
  - type: CEConsumable
    effects:
    - !type:RestoreMana
      amount: 1
    - !type:SpawnEntity
      spawns:
      - CEEffectManaRestore
  - type: PointLight
    color: "#1f36b6"
    radius: 1.1
    energy: 15

